[project]
name = "ensemble"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manish Anchan", email = "manishanchan789@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "openai>=3.14.1",
    "pydub>=0.25.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "soundfile>=0.14.0",
]

[project.scripts]
ensemble = "ensemble:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
