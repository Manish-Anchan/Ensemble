[project]
name = "ensemble"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manish Anchan", email = "manishanchan789@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "kokoro-onnx>=0.6.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "nvidia-cufft-cu12>=11.4.1.4",
    "nvidia-curand-cu12>=10.3.10.19",
    "onnxruntime-gpu==1.24.4",
    "openai>=3.14.1",
    "pydub>=0.25.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
ensemble = "ensemble:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
